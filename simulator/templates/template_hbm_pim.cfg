// As simple as it gets: 1-core system with 2 short processes

sys = {
    cores = {
        simpleCore = {
            type = "Timing";
            dcache = "l1d";
            icache = "l1i";
        };
    };

    lineSize = 64;
    frequency = 2400;

    caches = {
        l1d = {
            size = 65536;
        };
        l1i = {
            size = 32768;
        };
        l2 = {
            caches = 1;
            size = 2097152;
            children = "l1i|l1d";  // interleave
        };
    };

    mem = {
        type = "DRAMSim";
        techIni = "/home/basel/PIMSimulator/ini/HBM2_samsung_2M_16B_x64.ini";
        systemIni = "/home/basel/PIMSimulator/system_hbm.ini";
        outputDir = "/home/basel/zsim/pimsim_out/";
        traceName = ".";
//        latency = 20;
    };
};

sim = {
    pimMode = true;
    stats = "STATS_PATH";
    phaseLength = 1000;
    maxOffloadInstrs = 1000000000L;
    maxTotalInstrs = 1000000000L;
    statsPhaseInterval = 1000;
    printHierarchy = true;
    gmMBytes = 8192;
    pinOptions = "-ifeellucky";
    deadlockDetection = false;
};

process0 = {
    command = COMMAND_STRING
    startFastForwarded = True;
};

